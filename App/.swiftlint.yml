excluded:
  - .build
  - dist

disabled_rules:
  # Precise POSIX terminology for PTY master/slave file descriptors
  # (InteractiveProcessRunning.swift) -- renaming these would make the code
  # *less* clear against the actual system API, not more inclusive.
  - inclusive_language
  # This codebase uses trailing commas in multi-line literals in several
  # places; not worth churning existing files to satisfy one style.
  - trailing_comma

# Thresholds below are deliberate exceptions, not laziness -- line_length
# and identifier_name are back to SwiftLint's real defaults (Sources/ and
# Tests/Redguard, Tests/Battlespire, Tests/Shared are all clean against
# them). What's left loosened:
#
# - function_parameter_count: the DI-heavy launch-argument functions
#   (GameSession.buildArguments, RedguardGameSession.buildArguments) take
#   6 params by design -- splitting them into a parameter struct wouldn't
#   improve anything, just add indirection.
# - type_body_length / file_length: OnboardingWizard.swift and
#   RedguardOnboardingWizard.swift are large SwiftUI wizard views (~800
#   lines each). Splitting them into subviews is a real, separate refactor,
#   not a lint-compliance fix.
function_parameter_count:
  warning: 7

type_body_length:
  warning: 750

file_length:
  warning: 900
