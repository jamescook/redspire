# Bundled with the app and passed via -conf on every launch, so Redguard
# never depends on whatever's in the user's own ambient dosbox-staging.conf.
# Real regression this fixes: a fixed low cycle count left over from
# Battlespire-specific tuning elsewhere in that same ambient config starved
# Redguard's much heavier Voodoo rendering, causing a severe slowdown that
# had nothing to do with this game's own install.
[dosbox]
machine=svga_s3

[cpu]
cycles=auto

[voodoo]
voodoo=true
